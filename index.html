<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f62">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Metas do Dia</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(bricolage-700.woff2) format("woff2");font-weight:500 700;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-600.woff2) format("woff2");font-weight:600 700;font-display:swap}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: single phone column — header with today's score ring, three tabs (Hoje · Calendário · Metas), content cards below */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#15211f; --muted:#5f6e6b; --line:#dde3e1;
  --accent:#1f6f62; --accent-ink:#ffffff;
  --l0:#f1d9d4; --l1:#f2e2b8; --l2:#b9dccf; --l3:#d39b1c; --l3-ink:#2a1d00; --none:#e8ecea;
  --bad:#b4432f; --good:#1f6f62; --warn-bg:#fbe9dc; --warn:#9a3d12;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18211f; --ink:#e6eeec; --muted:#93a39f; --line:#2a3633;
  --accent:#5cc2ad; --accent-ink:#06201b;
  --l0:#4a2621; --l1:#4a3f1f; --l2:#1f4a40; --l3:#e8b23a; --l3-ink:#231700; --none:#1f2a28;
  --bad:#e57a63; --good:#5cc2ad; --warn-bg:#3d2216; --warn:#f0a27a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18211f; --ink:#e6eeec; --muted:#93a39f; --line:#2a3633;
  --accent:#5cc2ad; --accent-ink:#06201b;
  --l0:#4a2621; --l1:#4a3f1f; --l2:#1f4a40; --l3:#e8b23a; --l3-ink:#231700; --none:#1f2a28;
  --bad:#e57a63; --good:#5cc2ad; --warn-bg:#3d2216; --warn:#f0a27a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(12px, env(safe-area-inset-top, 0px)) 40px}
.wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
[hidden]{display:none!important}
.card .btn{white-space:normal}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.sub{color:var(--muted);font-size:.9rem}
header{display:flex;align-items:center;gap:14px}
header .txt{flex:1;min-width:0}
.ring{width:64px;height:64px;flex:none}
.ring text{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink)}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
nav button{font:600 .76rem var(--body);color:var(--muted);background:transparent;border:0;border-radius:9px;padding:10px 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.notice{font-size:.88rem;color:var(--muted);background:var(--none);border-radius:10px;padding:10px 12px}
.evening{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.evening b{font-family:var(--display);font-size:1.05rem}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
.itxt{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
li.done .itxt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--good)}
.st{display:flex;gap:6px;flex:none}
.st button{width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 1.05rem var(--body);cursor:pointer}
.st button.yes[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.st button.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px;border-radius:8px}
form.add{display:flex;gap:8px}
form.add input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{font:600 .95rem var(--body);border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .88rem var(--body);border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead h2{}
.nav2{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:1.1rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;border:0;background:var(--none);color:var(--ink);font:600 .9rem var(--body);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.day.empty{background:transparent;cursor:default}
.day.l0{background:var(--l0)} .day.l1{background:var(--l1)} .day.l2{background:var(--l2)}
.day.l3{background:var(--l3);color:var(--l3-ink);box-shadow:0 0 0 2px var(--l3) inset, 0 2px 8px color-mix(in srgb, var(--l3) 45%, transparent)}
.day.l3::after{content:"★";position:absolute;top:1px;right:4px;font-size:.62rem}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.day.future{opacity:.45;cursor:default}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mform label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.mform label.full{grid-column:1/-1}
.mform input{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.mform .btn{grid-column:1/-1}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font:500 11px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart text.end{fill:var(--ink);font-weight:600}
.readout{font-size:.9rem;min-height:1.4em;font-variant-numeric:tabular-nums}
.fotopick{display:flex;align-items:center;gap:12px;grid-column:1/-1}
.fotopick .btn{grid-column:auto}
.fotopick img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.viewer{display:flex;flex-direction:column;gap:10px}
.stage{display:grid;grid-template-columns:1fr;gap:8px}
.stage.cmp{grid-template-columns:1fr 1fr}
.frame{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--none);border-radius:12px;overflow:hidden;min-width:0}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.frame .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:.8rem;font-variant-numeric:tabular-nums;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.vctl{display:flex;align-items:center;gap:8px}
.vctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:none;width:52px;height:68px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--none);cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.tagbtn{font:600 .72rem var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 6px;cursor:pointer}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist>li{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.exlist>li:first-child{border-top:0}
.exlist>li.stag{background:var(--warn-bg);margin-inline:-16px;padding-inline:16px;border-top-color:transparent}
.exhead{display:flex;align-items:center;gap:10px}
.exname{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:0;color:var(--ink);font:600 1rem var(--body);cursor:pointer;overflow-wrap:anywhere}
.exlast{display:block;font:400 .82rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.st-chip{font:600 .72rem var(--body);letter-spacing:.03em;border-radius:999px;padding:3px 8px;white-space:nowrap;flex:none}
.st-up{background:var(--l2);color:var(--ink)}
.st-flat{background:var(--none);color:var(--muted)}
.st-new{background:var(--none);color:var(--muted)}
.st-stag{background:var(--warn);color:var(--surface)}
.exform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.exform label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);min-width:0}
.exform input{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.exform .btn{grid-column:1/-1}
.warnbox{background:var(--warn-bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.warnbox b{font-family:var(--display);color:var(--warn)}
.readout b{font-family:var(--display)}
.delta{font-size:.82rem;color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
table.hist th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 0}
table.hist td{padding:8px 0;border-top:1px solid var(--line)}
table.hist td.n,table.hist th.n{text-align:right;padding-right:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--none);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="27" fill="none" stroke="var(--none)" stroke-width="7"></circle>
      <circle id="ringArc" cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="0 170"></circle>
      <text id="ringTxt" x="32" y="37" text-anchor="middle">–</text>
    </svg>
    <div class="txt">
      <h1>Metas do Dia</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-hoje" data-v="hoje" aria-selected="true">Hoje</button>
    <button role="tab" id="tab-cal" data-v="cal" aria-selected="false">Calendário</button>
    <button role="tab" id="tab-metas" data-v="metas" aria-selected="false">Metas</button>
    <button role="tab" id="tab-med" data-v="med" aria-selected="false">Medidas</button>
    <button role="tab" id="tab-tr" data-v="tr" aria-selected="false">Treino</button>
  </nav>

  <div id="status" class="notice" hidden></div>

  <section id="v-hoje" class="wrap" style="gap:16px"></section>
  <section id="v-cal" class="wrap" style="gap:16px" hidden></section>
  <section id="v-metas" class="wrap" style="gap:16px" hidden></section>
  <section id="v-med" class="wrap" style="gap:16px" hidden></section>
  <section id="v-tr" class="wrap" style="gap:16px" hidden></section>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const fmtLong = d => d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

const S = { goals:[], days:{}, med:{}, tr:{ex:[], log:{}}, exSel:null, exOpen:null, exDel:null, view:'hoje', sel:null, month:null, col:null, ready:false };
let today = keyOf(new Date());
S.sel = today; S.month = new Date(); S.month.setDate(1);

const SUGESTOES = ['Ler 30 minutos','Fazer exercício','Beber 2 L de água','Orar / meditar','Dormir antes das 23h','Revisar a agenda de amanhã'];

/* ---------- dados ---------- */
function dayItems(k){
  const doc = S.days[k];
  const fixed = S.goals.map(g => ({id:g.id, text:g.text, extra:false, done:null}));
  if(!doc) return k <= today ? fixed : [];
  const items = doc.items.map(i => ({...i}));
  if(k === today){ // hoje acompanha as metas fixas atuais
    const ids = new Set(S.goals.map(g=>g.id));
    const kept = items.filter(i => i.extra || ids.has(i.id) || i.done !== null);
    for(const g of S.goals) if(!kept.some(i=>i.id===g.id)) kept.push({id:g.id,text:g.text,extra:false,done:null});
    return kept;
  }
  return items;
}
function score(k){
  if(!S.days[k]) return null;
  const it = dayItems(k); if(!it.length) return null;
  return it.filter(i=>i.done===true).length / it.length;
}
function level(p){ if(p===null) return ''; if(p>=1) return 'l3'; if(p>=.5) return 'l2'; if(p>0) return 'l1'; return 'l0'; }

const KEY = 'metas-do-dia-v1';
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify({goals:S.goals, days:S.days, med:S.med, tr:S.tr})); }
  catch(e){ $('#status').hidden=false; $('#status').textContent='Não consegui salvar no celular. Verifique se há espaço livre.'; }
}
function write(){ persist(); }
function saveDay(k, items){
  S.days[k] = {date:k, items, updated:Date.now()};
  write(); render();
}
function saveGoals(){ write(); render(); }

function setDone(k, id, val){
  const items = dayItems(k);
  const it = items.find(i=>i.id===id); if(!it) return;
  it.done = (it.done === val) ? null : val;
  saveDay(k, items);
}
function addExtra(k, text){ const items = dayItems(k); items.push({id:uid(), text, extra:true, done:null}); saveDay(k, items); }
function removeExtra(k, id){ saveDay(k, dayItems(k).filter(i=>i.id!==id)); }
function markRest(k){ const items = dayItems(k); items.forEach(i=>{ if(i.done===null) i.done=false; }); saveDay(k, items); }

/* ---------- views ---------- */
function renderRing(){
  const p = score(today), arc = $('#ringArc'), C = 2*Math.PI*27;
  const v = p===null ? 0 : p;
  arc.setAttribute('stroke-dasharray', (v*C)+' '+C); arc.setAttribute('visibility', v>0?'visible':'hidden');
  arc.setAttribute('stroke', p===1 ? 'var(--l3)' : 'var(--accent)');
  $('#ringTxt').textContent = p===null ? '–' : Math.round(p*100)+'%';
  $('#todayLabel').textContent = fmtLong(new Date());
}

function dayCard(k){
  const items = dayItems(k);
  const isToday = k===today;
  const done = items.filter(i=>i.done===true).length;
  const pend = items.filter(i=>i.done===null).length;
  const title = isToday ? 'Metas de hoje' : fmtLong(parseKey(k));
  let h = `<div class="card"><div class="row"><h2 style="flex:1">${esc(title)}</h2><span class="sub">${done}/${items.length}</span></div>`;
  h += `<div class="bar"><i style="width:${items.length?done/items.length*100:0}%"></i></div>`;
  if(!items.length){
    h += `<p class="sub" style="margin:0">Nenhuma meta para este dia. Cadastre suas metas fixas na aba <b>Metas</b> ou adicione uma extra abaixo.</p>`;
  } else {
    h += `<ul class="items">` + items.map(i => `<li class="${i.done===true?'done':''}">
      <span class="itxt">${esc(i.text)}${i.extra?'<span class="tag">extra</span>':''}</span>
      <span class="st">
        <button class="yes" aria-label="Cumprida" aria-pressed="${i.done===true}" data-a="yes" data-k="${k}" data-id="${i.id}">✓</button>
        <button class="no" aria-label="Não cumprida" aria-pressed="${i.done===false}" data-a="no" data-k="${k}" data-id="${i.id}">✕</button>
      </span>
      ${i.extra?`<button class="x" aria-label="Remover meta extra" data-a="rmx" data-k="${k}" data-id="${i.id}">×</button>`:''}
    </li>`).join('') + `</ul>`;
  }
  h += `<form class="add" data-k="${k}"><input id="extra-${k}" placeholder="Meta extra só para este dia" maxlength="120" autocomplete="off"><button class="btn ghost" type="submit">Adicionar</button></form>`;
  if(pend && items.length && k<=today) h += `<button class="btn ghost" data-a="rest" data-k="${k}">${pend>1?'Marcar as '+pend+' pendentes como não cumpridas':'Marcar a pendente como não cumprida'}</button>`;
  return h + `</div>`;
}

function renderHoje(){
  const hr = new Date().getHours();
  const items = dayItems(today);
  const pend = items.filter(i=>i.done===null).length;
  let h = '';
  if(hr >= 20 && items.length && pend){
    h += `<div class="evening"><b>Hora do fechamento do dia</b><span>Faltam ${pend} ${pend>1?'metas':'meta'} para registrar. Marque ✓ para cumprida e ✕ para não cumprida.</span></div>`;
  } else if(items.length && !pend && S.days[today]){
    const p = score(today);
    h += `<div class="evening"><b>${p===1?'Todas as metas cumpridas hoje ★':'Dia registrado'}</b><span>${p===1?'Este dia aparece em destaque dourado no calendário.':'Você cumpriu '+Math.round(p*100)+'% das metas de hoje.'}</span></div>`;
  }
  h += dayCard(today);
  if(S.sel !== today) h += dayCard(S.sel);
  $('#v-hoje').innerHTML = h;
}

function renderCal(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y,mo,1).getDay(), n = new Date(y,mo+1,0).getDate();
  const mn = m.toLocaleDateString('pt-BR',{month:'long'}); const label = mn.charAt(0).toUpperCase()+mn.slice(1)+' de '+y;
  let cells = ['D','S','T','Q','Q','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells += `<div class="day empty"></div>`;
  let full=0, reg=0, sum=0;
  for(let d=1; d<=n; d++){
    const k = y+'-'+pad(mo+1)+'-'+pad(d), p = score(k), fut = k>today;
    if(p!==null){ reg++; sum+=p; if(p>=1) full++; }
    const lab = p===null ? 'sem registro' : Math.round(p*100)+'% cumprido';

/* ---------- medidas ---------- */
const fmtN = (v,d=1) => v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtShort = k => { const d=parseKey(k); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'/'+String(d.getFullYear()).slice(2):''); };
const MEDS = {peso:{label:'Peso', unit:'kg'}, cintura:{label:'Circunferência abdominal', unit:'cm'}};
const chartData = {};
function series(f){ return Object.keys(S.med).sort().filter(k=>typeof S.med[k][f]==='number').map(k=>({k, t:parseKey(k).getTime(), v:S.med[k][f]})); }
function niceRange(min,max){
  if(min===max){ min-=1; max+=1; }
  const span=max-min, step=[.5,1,2,5,10,20].find(s=>span/s<=4)||50;
  return {lo:Math.floor(min/step)*step, hi:Math.ceil(max/step)*step, step};
}
function chartSVG(f, P, O){
  const pts=P||series(f), m=O||MEDS[f];
  if(pts.length<2) return `<p class="sub" style="margin:0">${pts.length? 'Registre mais uma '+(m.noun||'medição')+' para ver o gráfico.' : 'Nenhum registro ainda.'}</p>`;
  const W=340,H=170,L=38,R=40,T=12,B=24;
  const {lo,hi,step}=niceRange(Math.min(...pts.map(p=>p.v)), Math.max(...pts.map(p=>p.v)));
  const t0=pts[0].t, t1=pts[pts.length-1].t;
  const x=t=>L+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v, step<1?1:0)}</text>`; }
  g+=`<text x="${L}" y="${H-6}">${fmtShort(pts[0].k)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(pts[pts.length-1].k)}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=d+` L${x(t1).toFixed(1)} ${H-B} L${x(t0).toFixed(1)} ${H-B} Z`;
  const dots = pts.length<=40 ? pts.map(p=>`<circle class="pt" cx="${x(p.t)}" cy="${y(p.v)}" r="4"></circle>`).join('') : '';
  const last=pts[pts.length-1];
  chartData[f]={pts, x, y, L, R, W, H, T, B, fmt:m.fmt};
  return `<svg class="chart" id="ch-${f}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${m.label.toLowerCase()} ao longo do tempo">
    ${g}<path class="area" d="${area}"></path><path class="ln" d="${d}"></path>${dots}
    <circle class="pt" cx="${x(last.t)}" cy="${y(last.v)}" r="5"></circle>
    <text class="end" x="${x(last.t)+8}" y="${y(last.v)+4}">${fmtN(last.v)}</text>
    <g id="hv-${f}" visibility="hidden"><line class="cross" y1="${T}" y2="${H-B}"></line><circle class="pt" r="6"></circle></g>
  </svg><div class="readout" id="ro-${f}"><span class="sub">Toque no gráfico para ver cada ${m.noun||'medição'}.</span></div>`;
}
function hover(f, ev){
  const c=chartData[f], svg=$('#ch-'+f); if(!c||!svg) return;
  const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*c.W;
  let best=c.pts[0]; for(const p of c.pts) if(Math.abs(c.x(p.t)-px)<Math.abs(c.x(best.t)-px)) best=p;
  const g=$('#hv-'+f); g.setAttribute('visibility','visible');
  const ln=g.querySelector('line'), ci=g.querySelector('circle');
  ln.setAttribute('x1',c.x(best.t)); ln.setAttribute('x2',c.x(best.t)); ci.setAttribute('cx',c.x(best.t)); ci.setAttribute('cy',c.y(best.v));
  $('#ro-'+f).innerHTML = `${esc(fmtLong(parseKey(best.k)))}: <b>${c.fmt?c.fmt(best):fmtN(best.v)+' '+MEDS[f].unit}</b>`;
}
function summary(f){
  const pts=series(f), m=MEDS[f]; if(!pts.length) return '';
  const last=pts[pts.length-1], first=pts[0], dlt=last.v-first.v;
  const dtxt = pts.length>1 ? `${dlt>0?'+':dlt<0?'−':''}${fmtN(Math.abs(dlt))} ${m.unit} desde ${fmtShort(first.k)}` : 'primeira medição';
  return `<div class="stat"><b>${fmtN(last.v)} <span style="font-size:.9rem">${m.unit}</span></b><span>${m.label.split(' ')[0]} em ${fmtShort(last.k)} · ${dtxt}</span></div>`;
}

/* ---------- fotos (guardadas no próprio celular, em IndexedDB) ---------- */
let pendingFoto=null, playTimer=null;
const urls={};
let dbp=null;
function idb(){
  if(!dbp) dbp=new Promise((res,rej)=>{ const q=indexedDB.open('metas-fotos',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('fotos');
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
  return dbp;
}
async function tx(mode, fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('fotos',mode); const r=fn(t.objectStore('fotos')); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const fotoPut=(k,b)=>tx('readwrite',st=>st.put(b,k));
const fotoGet=k=>tx('readonly',st=>st.get(k));
const fotoDel=k=>tx('readwrite',st=>st.delete(k));
function dropUrl(k){ if(urls[k]){ URL.revokeObjectURL(urls[k]); delete urls[k]; } }
async function fotoUrl(k){ if(urls[k]) return urls[k]; const b=await fotoGet(k); if(!b) return null; return urls[k]=URL.createObjectURL(b); }
async function compress(file){
  let bmp;
  try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ bmp=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const M=1280, w=bmp.width, h=bmp.height, sc=Math.min(1, M/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
}
const fotoKeys=()=>Object.keys(S.med).filter(k=>S.med[k].foto).sort();
function capOf(k){ const r=S.med[k]||{}; const p=[fmtShort(k)]; if(typeof r.peso==='number') p.push(fmtN(r.peso)+' kg'); if(typeof r.cintura==='number') p.push(fmtN(r.cintura)+' cm'); return p.join(' · '); }

/* ---------- treino (musculação) ---------- */
const kgFmt = v => fmtN(v, Number.isInteger(v)?0:1);
function exLog(id){ return (S.tr.log[id]||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0); }
// Uma sessão é recorde quando supera tudo antes dela: mais peso, ou o mesmo peso maior com mais repetições.
function exStatus(id){
  const L=exLog(id); const n=L.length;
  if(!n) return {code:'none', since:0, L};
  let bestKg=-1, bestReps=-1, lastPR=0;
  L.forEach((e,i)=>{ if(e.kg>bestKg || (e.kg===bestKg && e.reps>bestReps)){ bestKg=e.kg; bestReps=e.reps; lastPR=i; } });
  const since=n-1-lastPR;
  let code = n<2 ? 'new' : since===0 ? 'up' : since>=3 ? 'stag' : 'flat';
  return {code, since, L, best:{kg:bestKg, reps:bestReps, d:L[lastPR].d}};
}
const CHIP = {
  new:  ['st-new','Começando'],
  up:   ['st-up','↑ Evoluiu'],
  flat: ['st-flat','Sem evolução'],
  stag: ['st-stag','⚠ Estagnado'],
  none: ['st-new','Sem registro']
};
function chipOf(st){ const [c,t]=CHIP[st.code]; const extra = st.code==='flat' ? ` há ${st.since} ${st.since>1?'sessões':'sessão'}` : st.code==='stag' ? ` · ${st.since} sessões` : ''; return `<span class="st-chip ${c}">${t}${extra}</span>`; }
function exForm(id){
  const L=exLog(id), last=L[L.length-1]||{}, todayE=L.find(e=>e.d===today);
  const kg=todayE?todayE.kg:(last.kg??''), reps=todayE?todayE.reps:(last.reps??'');
  return `<form class="exform" data-ex="${id}">
    <label for="ex-kg-${id}">Peso (kg)<input type="number" id="ex-kg-${id}" inputmode="decimal" step="any" min="0" max="999" value="${kg}" required></label>
    <label for="ex-rp-${id}">Repetições<input type="number" id="ex-rp-${id}" inputmode="numeric" step="1" min="1" max="200" value="${reps}" required></label>
    <label for="ex-dt-${id}">Data<input type="date" id="ex-dt-${id}" value="${today}" max="${today}" required></label>
    <button class="btn" type="submit">${todayE?'Atualizar registro de hoje':'Salvar'}</button>
  </form>`;
}

  $('#v-med').innerHTML = `<div class="card"><h2>Nova medição</h2>
    <form class="mform" id="medform">
      <label class="full" for="m-data">Data<input type="date" id="m-data" value="${today}" max="${today}" required></label>
      <label for="m-peso">Peso (kg)<input type="number" id="m-peso" inputmode="decimal" step="0.1" min="20" max="400" placeholder="ex.: 82,5"></label>
      <label for="m-cint">Circ. abdominal (cm)<input type="number" id="m-cint" inputmode="decimal" step="0.5" min="30" max="250" placeholder="ex.: 94"></label>
      <div class="fotopick"><label class="btn ghost" for="m-foto" style="display:inline-block;color:var(--accent);font-size:.95rem">Adicionar foto</label><input type="file" id="m-foto" accept="image/*" hidden><img id="m-prev" alt="Foto escolhida" hidden><button type="button" class="x" id="m-clr" aria-label="Tirar a foto escolhida" data-a="clrfoto" hidden>×</button></div>
      <button class="btn" type="submit">Salvar medição</button>
    </form>
    <p class="sub" style="margin:0">Preencha o que quiser: peso, abdômen, foto ou tudo junto. Se já houver medição nessa data, ela é atualizada.</p></div>
    ${sm?`<div class="card"><div class="stats" style="grid-template-columns:1fr 1fr">${sm}</div></div>`:''}
    <div class="card"><h2>Peso (kg)</h2>${chartSVG('peso')}</div>
    <div class="card"><h2>Circunferência abdominal (cm)</h2>${chartSVG('cintura')}</div>
    ${fotoCard()}
    <div class="card"><h2>Histórico</h2>${keys.length?`<div style="overflow-x:auto"><table class="hist"><thead><tr><th>Data</th><th class="n">Peso</th><th class="n">Abdômen</th><th></th></tr></thead><tbody>
      ${keys.map(k=>{const r=S.med[k];return `<tr><td>${fmtShort(k)}</td><td class="n">${typeof r.peso==='number'?fmtN(r.peso)+' kg':'–'}</td><td class="n">${typeof r.cintura==='number'?fmtN(r.cintura)+' cm':'–'}</td><td style="text-align:right;white-space:nowrap">${r.foto?`<button class="tagbtn" data-a="verfoto" data-k="${k}">Foto</button>`:''}<button class="x" aria-label="Apagar medição de ${fmtShort(k)}" data-a="rmm" data-k="${k}">×</button></td></tr>`}).join('')}
    </tbody></table></div>`:`<p class="sub" style="margin:0">Suas medições aparecem aqui.</p>`}</div>`;
  for(const f of ['peso','cintura']){ const svg=$('#ch-'+f); if(svg){ svg.addEventListener('pointerdown',e=>hover(f,e)); svg.addEventListener('pointermove',e=>hover(f,e)); } }
  fillFotos();
}
async function saveMed(){
  const k=$('#m-data').value, pv=parseFloat($('#m-peso').value), cv=parseFloat($('#m-cint').value);
  const st=$('#status');
  if(!k || k>today){ st.hidden=false; st.textContent='Escolha uma data até hoje.'; return; }
  if(isNaN(pv) && isNaN(cv) && !pendingFoto){ st.hidden=false; st.textContent='Preencha o peso, a circunferência abdominal ou escolha uma foto.'; return; }
  const r={...(S.med[k]||{})};
  if(!isNaN(pv)) r.peso=Math.round(pv*10)/10;
  if(!isNaN(cv)) r.cintura=Math.round(cv*10)/10;
  if(pendingFoto){
    try{ await fotoPut(k, pendingFoto); dropUrl(k); r.foto=true; }
    catch(e){ st.hidden=false; st.textContent='Não consegui guardar a foto no celular. Verifique se há espaço livre e tente de novo.'; return; }
  }
  pendingFoto=null;
  S.med[k]=r; st.hidden=true; persist();
  if(r.foto){ const fk=fotoKeys(); S.fotoIdx=fk.indexOf(k); }
  render();
}

function render(){
  const nk = keyOf(new Date()); if(nk!==today){ if(S.sel===today) S.sel=nk; today=nk; }
  renderRing();
  for(const v of ['hoje','cal','metas','med','tr']){
    $('#v-'+v).hidden = S.view!==v;
    $('#tab-'+v).setAttribute('aria-selected', S.view===v);
  }
  if(S.view==='hoje') renderHoje(); else if(S.view==='cal') renderCal(); else if(S.view==='med') renderMed(); else if(S.view==='tr') renderTr(); else renderMetas();
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-v],[data-a]'); if(!t) return;
  if(t.dataset.v){ S.view=t.dataset.v; if(S.view==='hoje') S.sel=today; if(S.view==='tr'){ S.exSel=null; S.exOpen=null; S.exDel=null; } render(); return; }
  const a=t.dataset.a, k=t.dataset.k, id=t.dataset.id;
  if(a==='yes') setDone(k,id,true);
  else if(a==='no') setDone(k,id,false);
  else if(a==='rmx') removeExtra(k,id);
  else if(a==='rest') markRest(k);
  else if(a==='prev'){ S.month.setMonth(S.month.getMonth()-1); render(); }
  else if(a==='next'){ S.month.setMonth(S.month.getMonth()+1); render(); }
  else if(a==='pick'){ S.sel=k; S.view='hoje'; render(); window.scrollTo({top:0}); }
  else if(a==='rmg'){ S.goals=S.goals.filter(g=>g.id!==id); saveGoals(); }
  else if(a==='exp') exportar();
  else if(a==='imp') $('#impfile').click();
  else if(a==='rmm'){ const had=S.med[k]&&S.med[k].foto; delete S.med[k]; persist(); if(had){ dropUrl(k); fotoDel(k).catch(()=>{}); } stopPlay(); render(); }
  else if(a==='clrfoto'){ pendingFoto=null; $('#m-prev').hidden=true; $('#m-clr').hidden=true; }
  else if(a==='fprev'){ stopPlay(); stepFoto(-1); }
  else if(a==='fnext'){ stopPlay(); stepFoto(1); }
  else if(a==='fgo'){ stopPlay(); S.fotoIdx=+t.dataset.i; showFoto(); }
  else if(a==='fplay') togglePlay();
  else if(a==='fcmp'){ S.cmp=!S.cmp; stopPlay(); render(); }
  else if(a==='verfoto'){ stopPlay(); S.fotoIdx=fotoKeys().indexOf(k); render(); const st=$('#stage'); st&&st.scrollIntoView({block:'center'}); }
  else if(a==='expf') exportar(true);
  else if(a==='exopen'){ S.exOpen=id; S.exDel=null; render(); const i=$('#ex-kg-'+id); i&&i.focus(); }
  else if(a==='exsel'){ S.exSel=id; S.exOpen=null; S.exDel=null; render(); window.scrollTo({top:0}); }
  else if(a==='exback'){ S.exSel=null; render(); }
  else if(a==='exdel'){ S.exDel=id; S.exOpen=null; render(); }
  else if(a==='exdelno'){ S.exDel=null; render(); }
  else if(a==='exdelok'){ S.tr.ex=S.tr.ex.filter(x=>x.id!==id); delete S.tr.log[id]; S.exDel=null; persist(); render(); }
  else if(a==='exrm'){ S.tr.log[S.exSel]=(S.tr.log[S.exSel]||[]).filter(r=>r.d!==k); persist(); render(); }
  else if(a==='sug'){ S.goals.push({id:uid(), text:t.dataset.t}); saveGoals(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if(e.target.id==='medform'){ saveMed(); return; }
  if(e.target.dataset.ex){ saveEx(e.target.dataset.ex); return; }
  if(e.target.id==='exadd'){ const n=$('#newex').value.trim(); if(n){ S.tr.ex.push({id:uid(), nome:n}); persist(); render(); setTimeout(()=>{const i=$('#newex'); i&&i.focus();},0); } return; }
  const f=e.target, inp=f.querySelector('input'), txt=inp.value.trim(); if(!txt) return;
  if(f.dataset.k==='__goal'){ S.goals.push({id:uid(), text:txt}); saveGoals(); setTimeout(()=>{const i=$('#newgoal'); i&&i.focus();},0); }
  else addExtra(f.dataset.k, txt);
});
async function exportar(comFotos){
  const data={app:'metas-do-dia', versao:4, exportado:new Date().toISOString(), goals:S.goals, days:S.days, med:S.med, tr:S.tr};
  if(comFotos){ data.fotos={}; for(const k of fotoKeys()){ try{ const b=await fotoGet(k); if(b) data.fotos[k]=await blobToDataURL(b); }catch(e){} } }
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'metas-do-dia-'+today+(comFotos?'-com-fotos':'')+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
document.addEventListener('change', async e => {
  if(e.target.id==='fslider'){ stopPlay(); S.fotoIdx=+e.target.value; showFoto(); return; }
  if(e.target.id==='m-foto' && e.target.files[0]){
    const st=$('#status');
    try{ pendingFoto=await compress(e.target.files[0]); const p=$('#m-prev'); if(p.src) URL.revokeObjectURL(p.src); p.src=URL.createObjectURL(pendingFoto); p.hidden=false; $('#m-clr').hidden=false; }
    catch(err){ pendingFoto=null; st.hidden=false; st.textContent='Não consegui abrir essa imagem. Tente outra foto.'; }
    e.target.value=''; return;
  }
  if(e.target.id!=='impfile' || !e.target.files[0]) return;
  const st=$('#status'); st.hidden=false;
  try{
    const v = JSON.parse(await e.target.files[0].text());
    if(!v || !Array.isArray(v.goals) || typeof v.days!=='object') throw 0;
    S.goals = v.goals; S.days = v.days; S.med = (v.med && typeof v.med==='object') ? v.med : {}; S.tr = (v.tr && Array.isArray(v.tr.ex)) ? {ex:v.tr.ex, log:v.tr.log||{}} : {ex:[], log:{}};
    let nf=0;
    if(v.fotos && typeof v.fotos==='object'){ for(const [k,du] of Object.entries(v.fotos)){ try{ const b=await (await fetch(du)).blob(); await fotoPut(k,b); dropUrl(k); if(S.med[k]){ S.med[k].foto=true; nf++; } }catch(err){} } }
    persist(); render();
    st.textContent='Dados importados: '+Object.keys(v.days).length+' dias, '+v.goals.length+' metas fixas e '+Object.keys(S.med).length+' medições'+(nf?' ('+nf+' com foto)':'')+' e '+S.tr.ex.length+' exercícios.';
  }catch(err){ st.textContent='Esse arquivo não parece ser um backup do Metas do Dia. Escolha o arquivo .json que você exportou.'; }
  e.target.value='';
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && keyOf(new Date())!==today) render(); });
if(location.hash==='#treino') S.view='tr'; else if(location.hash==='#medidas') S.view='med'; else if(location.hash==='#metas') S.view='metas'; else if(location.hash==='#calendario') S.view='cal';

/* ---------- armazenamento local ---------- */
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const v = JSON.parse(raw); S.goals = v.goals||[]; S.days = v.days||{}; S.med = v.med||{}; if(v.tr&&Array.isArray(v.tr.ex)) S.tr={ex:v.tr.ex, log:v.tr.log||{}}; } }catch(e){}
  $('#status').hidden = true;
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load(); render();
})();
</script>
</body>
</html>
